name: AEMS CI Gate

on:
  push:
    branches: [main, "feat/**", "fix/**", "db/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Unit & Integration Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript strict typecheck
        run: npm run typecheck

      - name: Run Vitest unit & integration suites
        run: npm test

      - name: Build production Next.js bundle
        run: npm run build
